<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up • StudyTracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { primary: '#6D28D9', accent: '#A78BFA' }
                }
            }
        }
    </script>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-md">
    <div class="bg-white/95 backdrop-blur-xl rounded-3xl shadow-2xl p-10 border border-purple-100">
        
        <div class="text-center mb-10">
            <div class="w-24 h-24 bg-gradient-to-br from-indigo-600 to-purple-600 rounded-2xl mx-auto flex items-center justify-center mb-6 shadow-lg">
                <i class="fas fa-user-plus text-white text-4xl"></i>
            </div>
            <h1 class="text-4xl font-bold text-gray-800">Create Account</h1>
            <p class="text-gray-600 mt-2">Join thousands of focused students</p>
        </div>

        <form method="post" class="space-y-6">
            {% csrf_token %}
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Username</label>
                <input type="text" name="username" required maxlength="150"
                       class="w-full px-5 py-4 rounded-xl border-2 border-gray-200 focus:border-indigo-500 focus:outline-none transition text-lg"
                       placeholder="Choose a cool username">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                <input type="password" name="password1" required
                       class="w-full px-5 py-4 rounded-xl border-2 border-gray-200 focus:border-purple-500 focus:outline-none transition text-lg"
                       placeholder="Create a strong password">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Confirm Password</label>
                <input type="password" name="password2" required
                       class="w-full px-5 py-4 rounded-xl border-2 border-gray-200 focus:border-purple-500 focus:outline-none transition text-lg"
                       placeholder="Type it again">
            </div>

            {% if form.errors %}
                <div class="bg-red-50 border border-red-300 text-red-700 px-4 py-3 rounded-xl text-sm">
                    {% for field, errors in form.errors.items %}
                        {% for error in errors %}
                            <p>{{ error }}</p>
                        {% endfor %}
                    {% endfor %}
                </div>
            {% endif %}

            <button type="submit"
                    class="w-full py-5 bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-bold text-xl rounded-xl hover:shadow-2xl transform hover:scale-105 transition duration-300">
                Sign Up & Start Studying
            </button>
        </form>

        <p class="text-center mt-8 text-gray-600">
            Already have an account?
            <a href="{% url 'login' %}" class="text-indigo-600 font-bold hover:underline">
                Log in
            </a>
        </p>
    </div>
</div>

</body>
</html>
